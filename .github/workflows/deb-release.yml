name: Build and Release .deb

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-deb:
    strategy:
      matrix:
        ubuntu: [22.04, 24.04]

    runs-on: ubuntu-latest

    container:
      image: ubuntu:${{ matrix.ubuntu }}

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Install Debian packaging and build dependencies
      - name: Install build dependencies
        run: |
          apt update
          apt install -y \
            build-essential \
            cmake \
            pkg-config \
            libgtk-4-dev \
            librsvg2-dev \
            debhelper \
            dh-make \
            devscripts \
            fakeroot

      # 3. Run your Debian build script
      - name: Build Debian package
        run: |
          chmod +x ./scripts/build-deb.sh
          ./scripts/build-deb.sh

      # 4. Collect .deb
      - name: Find .deb
        run: |
          mv ../*.deb .
          for f in *.deb; do
            mv "$f" "${f%.deb}_ubuntu${{ matrix.ubuntu }}.deb"
          done
          ls -l *.deb

      # 5. Upload Artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minesweeper_ubuntu${{ matrix.ubuntu }}
          path: |
            *.deb
          if-no-files-found: error
