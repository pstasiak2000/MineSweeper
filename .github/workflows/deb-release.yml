name: Build and Release .deb

on:
  workflow_dispatch:    
  push:
    tags:
      - 'v*'  # Trigger workflow on tags like v1.0.1

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake pkg-config \
            libgtk-4-dev librsvg2-dev dh-make debhelper devscripts

      # 3. Determine version from git tag
      - name: Set version from git tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      # 4. Copy Debian packaging files
      - name: Prepare Debian folder
        run: |
          rm -rf debian
          mkdir debian
          cp -r packaging/debian debian

      # 5. Update changelog automatically
      - name: Update changelog
        run: |
          if [ -f debian/changelog ]; then
            dch --newversion "${VERSION}-1" "Automatic build from git tag ${VERSION}" --force-distribution
          else
            dch --create -v "${VERSION}-1" --package minesweeper \
                "Automatic build from git tag ${VERSION}" --force-distribution
          fi

      # 6. Build project
      - name: Build CMake project
        run: |
          rm -rf build
          cmake -B build -S . -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      # 7. Install files into staging directory for .deb
      - name: Prepare staging directory
        run: |
          mkdir -p debian-install/usr
          cmake --install build --prefix=$(pwd)/debian-install/usr
          
      # 8. Build .deb package
      - name: Build .deb
        run: |
          DEB_FILE="minesweeper_${VERSION}_amd64.deb"
          dpkg-deb --build debian-install "$DEB_FILE"
          echo "DEB_FILE=$DEB_FILE" >> $GITHUB_ENV

      # 9. Upload .deb to GitHub Release
      - name: Upload .deb to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.DEB_FILE }}
