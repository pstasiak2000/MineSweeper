name: Build and Release .deb

on:
  workflow_dispatch:    
  push:
    tags:
      - 'v*'  # Trigger workflow on tags like v1.0.1

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history and tags


      # 2. Install Debian packaging and build dependencies
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake pkg-config \
            libgtk-4-dev librsvg2-dev debhelper dh-make devscripts fakeroot

      # 3. Run your Debian build script
      - name: Build Debian package
        run: |
          chmod +x ./scripts/build-deb.sh
          ./scripts/build-deb.sh

      # 4. Find the generated .deb file
      - name: Find .deb
        id: debfile
        run: |
          mv ../*.deb .
          DEB=$(find .. -maxdepth 1 -type f -name "minesweeper_*.deb" | head -n1)
          echo "DEB_FILE=$DEB" >> $GITHUB_ENV
          echo "Found .deb: $DEB"

      # 5. Create GitHub Release and upload the .deb
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_FILE }}
          path: |
            *.deb
          if-no-files-found: error
